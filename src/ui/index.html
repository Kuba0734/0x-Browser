<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: http: data:; font-src 'self'"
    />
    <title>0x Browser</title>
    <link rel="stylesheet" href="./tokens.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header id="chrome">
      <div id="tabstrip">
        <div id="tabs" role="tablist"></div>
        <button
          id="new-tab"
          class="icon-btn"
          data-icon="plus"
          title="New tab"
          aria-label="New tab"
        ></button>
      </div>
      <div id="toolbar">
        <button
          id="back"
          class="icon-btn"
          data-icon="back"
          title="Back"
          aria-label="Back"
          disabled
        ></button>
        <button
          id="forward"
          class="icon-btn"
          data-icon="forward"
          title="Forward"
          aria-label="Forward"
          disabled
        ></button>
        <button id="reload" class="icon-btn" title="Reload" aria-label="Reload">
          <span class="icon-reload" data-icon="reload"></span>
          <span class="icon-stop" data-icon="close"></span>
        </button>
        <button id="home" class="icon-btn" data-icon="home" title="Home" aria-label="Home"></button>
        <form id="address-form">
          <input
            id="address"
            type="text"
            spellcheck="false"
            autocomplete="off"
            placeholder="Search or enter address"
            aria-label="Address"
          />
          <button
            id="star"
            type="button"
            class="icon-btn"
            data-icon="star"
            title="Bookmark this page"
            aria-label="Bookmark this page"
            aria-pressed="false"
          ></button>
        </form>
        <button
          id="store-install"
          class="store-install"
          title="Install this extension in 0x Browser"
          hidden
        >
          <span data-icon="extensions"></span>
          <span class="store-label">Add to 0x</span>
        </button>
        <div id="extension-actions"></div>
        <button
          id="extensions-button"
          class="icon-btn"
          data-icon="extensions"
          title="Extensions"
          aria-label="Extensions"
          hidden
        ></button>
        <button id="update-button" class="update-pill" aria-live="polite" hidden>
          <span data-icon="update"></span>
          <span class="update-label"></span>
          <span class="update-progress"><span></span></span>
        </button>
        <button id="downloads-button" class="icon-btn" title="Downloads" aria-label="Downloads">
          <span data-icon="download"></span>
          <span class="download-label"></span>
          <span class="download-progress"><span></span></span>
        </button>
        <button
          id="menu-button"
          class="icon-btn"
          data-icon="menu"
          title="Menu"
          aria-label="Menu"
        ></button>
      </div>
      <nav id="bookmark-bar" aria-label="Bookmarks bar" hidden></nav>
      <div id="progress"></div>
    </header>
    <nav id="sidebar" aria-label="Sidebar" hidden>
      <div id="sidebar-sites"></div>
      <button
        id="sidebar-add"
        class="icon-btn"
        data-icon="plus"
        title="Add site to sidebar"
        aria-label="Add site to sidebar"
      ></button>
    </nav>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
